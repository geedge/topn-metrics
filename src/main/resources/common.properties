#--------------------------------Kafka消费组信息------------------------------#
#kafka的地址信息
kafka.consumer.broker=192.168.54.241:9092

#kafka 接收数据topic
kafka.consumer.topic=SESSION-RECORD

#消费组名称
kafka.consumer.group.id=topn-metrics-job-20231101-t1-t

#--------------------------------Kafka生产者信息------------------------------#
#kafka的地址信息
kafka.producer.broker=192.168.44.12:9094

kafka.producer.topic=TRAFFIC-TOP-METRIC

#--------------------------------topology配置------------------------------#
#任务名称
job.name=agg_session_record_topn

#source并行度
kafka.consumer.parallelism=3

#任务并行度
task.parallelism=3

#二次排序并行度
orderby.parallelism=3

#入库并行度，通常等于orderby.parallelism
sink.parallelism=3

#窗口延迟等待时间单位秒
watermark.time=90

#top结果限制
top.limit=10000

#滑动窗口总时间单位分钟
window.time.minute=5

#--------------------------------Kafka连接配置------------------------------#
#kafka source poll


#kafka消费者是否开启安全验证 0不开启 1SSL 2 SASL
kafka.consumer.security=0

#kafka SASL验证用户名
kafka.consumer.user=admin

#kafka SASL及SSL验证密码
kafka.consumer.pin=galaxy2019

#1SSL需要
tools.consumer.library=/home/bigdata/topology/dat/

#kafka消费者是否开启安全验证 0不开启 1SSL 2 SASL
